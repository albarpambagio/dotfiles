# PipeWire client config for laptop speaker EQ.
#
# Run with: pipewire -c speaker-eq.conf
# Processes audio through a parametric EQ chain targeting the internal speakers.

context.properties = {
    log.level = 0
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt
      args = { }
      flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-filter-chain
      args = {
        node.description = "Laptop Speakers EQ"
        media.name       = "Laptop Speakers EQ"

        filter.graph = {
          nodes = [
            # High-pass: remove sub-bass below 55Hz
            { type = builtin name = hp_l   label = bq_highpass control = { "Freq" = 55.0 "Q" = 0.7 } }
            # Bass boost: +5dB at 100Hz
            { type = builtin name = b1_l   label = bq_peaking  control = { "Freq" = 100.0 "Q" = 1.2 "Gain" = 5.0 } }
            # Upper bass: +3dB at 200Hz
            { type = builtin name = b2_l   label = bq_peaking  control = { "Freq" = 200.0 "Q" = 1.5 "Gain" = 3.0 } }
            # Cut boxiness: -2dB at 400Hz
            { type = builtin name = m1_l   label = bq_peaking  control = { "Freq" = 400.0 "Q" = 2.0 "Gain" = -2.0 } }
            # Cut mids: -1.5dB at 800Hz
            { type = builtin name = m2_l   label = bq_peaking  control = { "Freq" = 800.0 "Q" = 1.5 "Gain" = -1.5 } }
            # Cut harshness: -2dB at 1.5kHz
            { type = builtin name = m3_l   label = bq_peaking  control = { "Freq" = 1500.0 "Q" = 1.2 "Gain" = -2.0 } }
            # Presence: -1dB at 3kHz
            { type = builtin name = p1_l   label = bq_peaking  control = { "Freq" = 3000.0 "Q" = 1.0 "Gain" = -1.0 } }
            # Brilliance: +2dB at 8kHz
            { type = builtin name = t1_l   label = bq_peaking  control = { "Freq" = 8000.0 "Q" = 1.0 "Gain" = 2.0 } }
            # Air: +1.5dB shelf at 12kHz
            { type = builtin name = t2_l   label = bq_highshelf control = { "Freq" = 12000.0 "Q" = 0.7 "Gain" = 1.5 } }

            # Right channel (identical)
            { type = builtin name = hp_r   label = bq_highpass control = { "Freq" = 55.0 "Q" = 0.7 } }
            { type = builtin name = b1_r   label = bq_peaking  control = { "Freq" = 100.0 "Q" = 1.2 "Gain" = 5.0 } }
            { type = builtin name = b2_r   label = bq_peaking  control = { "Freq" = 200.0 "Q" = 1.5 "Gain" = 3.0 } }
            { type = builtin name = m1_r   label = bq_peaking  control = { "Freq" = 400.0 "Q" = 2.0 "Gain" = -2.0 } }
            { type = builtin name = m2_r   label = bq_peaking  control = { "Freq" = 800.0 "Q" = 1.5 "Gain" = -1.5 } }
            { type = builtin name = m3_r   label = bq_peaking  control = { "Freq" = 1500.0 "Q" = 1.2 "Gain" = -2.0 } }
            { type = builtin name = p1_r   label = bq_peaking  control = { "Freq" = 3000.0 "Q" = 1.0 "Gain" = -1.0 } }
            { type = builtin name = t1_r   label = bq_peaking  control = { "Freq" = 8000.0 "Q" = 1.0 "Gain" = 2.0 } }
            { type = builtin name = t2_r   label = bq_highshelf control = { "Freq" = 12000.0 "Q" = 0.7 "Gain" = 1.5 } }
          ]

          links = [
            { output = "hp_l:Out"  input = "b1_l:In" }
            { output = "b1_l:Out"  input = "b2_l:In" }
            { output = "b2_l:Out"  input = "m1_l:In" }
            { output = "m1_l:Out"  input = "m2_l:In" }
            { output = "m2_l:Out"  input = "m3_l:In" }
            { output = "m3_l:Out"  input = "p1_l:In" }
            { output = "p1_l:Out"  input = "t1_l:In" }
            { output = "t1_l:Out"  input = "t2_l:In" }

            { output = "hp_r:Out"  input = "b1_r:In" }
            { output = "b1_r:Out"  input = "b2_r:In" }
            { output = "b2_r:Out"  input = "m1_r:In" }
            { output = "m1_r:Out"  input = "m2_r:In" }
            { output = "m2_r:Out"  input = "m3_r:In" }
            { output = "m3_r:Out"  input = "p1_r:In" }
            { output = "p1_r:Out"  input = "t1_r:In" }
            { output = "t1_r:Out"  input = "t2_r:In" }
          ]

          inputs  = [ "hp_l:In" "hp_r:In" ]
          outputs = [ "t2_l:Out" "t2_r:Out" ]
        }

        audio.channels = 2
        audio.position = [ FL FR ]

        capture.props = {
          node.name   = "laptop_speaker_eq"
          media.class = Audio/Sink
        }
        playback.props = {
          node.name     = "laptop_speaker_eq_output"
          node.passive  = true
          target.object = "alsa_output.pci-0000_07_00.6.HiFi__Speaker__sink"
          node.dont-move = true
          node.dont-fallback = true
          node.linger = true
        }
      }
    }
]
