# DC-blocked feed for HushMic. Mic1 has a huge DC offset (0.12-0.40!)
# that poisons denoiser models - they gate the real voice. This removes
# DC before HushMic sees the signal.
context.properties = { log.level = 0 }
context.spa-libs = { audio.convert.* = audioconvert/libspa-audioconvert support.* = support/libspa-support }
context.modules = [
  { name = libpipewire-module-rt      args = { } flags = [ ifexists nofail ] }
  { name = libpipewire-module-protocol-native }
  { name = libpipewire-module-client-node }
  { name = libpipewire-module-adapter }
  { name = libpipewire-module-filter-chain args = {
      node.description = "Mic DC-Free"
      filter.graph = {
        nodes = [ { type = builtin name = dc label = dcblock control = { "R" = 0.995 } } ]
        links = []
      }
      audio.channels = 1
      audio.position = [ MONO ]
      capture.props = { node.name = "capture.mic_dc" node.passive = true audio.rate = 48000 node.target = "alsa_input.pci-0000_07_00.6.HiFi__Mic1__source" }
      playback.props = { node.name = "mic_dc" node.passive = true media.class = Audio/Source audio.rate = 48000 }
  } }
]
